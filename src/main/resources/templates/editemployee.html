<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px auto; max-width: 600px; background: #f8f9fa; color: #222; }
        .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
        label { font-weight: bold; margin-bottom: 4px; font-size: 14px; }
        input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .error { color: #dc2626; font-size: 12px; margin-top: 4px; }
        .btn { padding: 9px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #6b7280; color: #fff; margin-left: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Edit Employee</h2>
    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" th:field="*{fullName}">
            <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Phone (10 digits)</label>
            <input type="text" th:field="*{phone}">
            <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" th:field="*{department}">
            <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
        </div>

        <div class="form-group">
            <label>Salary</label>
            <input type="number" step="0.01" th:field="*{salary}">
            <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
        </div>

        <button type="submit" class="btn btn-primary">Update Employee</button>
        <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

</body>
</html>
