<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px auto; max-width: 960px; background: #f8f9fa; color: #222; }
        h1, h2 { color: #1f2937; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 24px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 4px; font-size: 14px; }
        input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .error { color: #dc2626; font-size: 12px; margin-top: 4px; }
        .alert-success { background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-bottom: 16px; border: 1px solid #86efac; }
        .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #2563eb; color: #fff; margin-top: 14px; }
        .btn-edit { background: #f59e0b; color: #fff; }
        .btn-delete { background: #dc2626; color: #fff; }
        .btn-secondary { background: #6b7280; color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f3f4f6; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    </style>
</head>
<body>

<h1>Employee Management System</h1>

<div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

<div class="card">
    <h2>Register New Employee</h2>
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" placeholder="e.g. Kamal Perera">
                <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="text" th:field="*{email}" placeholder="e.g. kamal@company.com">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label>Phone (10 digits)</label>
                <input type="text" th:field="*{phone}" placeholder="e.g. 0771234567">
                <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" th:field="*{department}" placeholder="e.g. Engineering">
                <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
            </div>

            <div class="form-group">
                <label>Salary</label>
                <input type="number" step="0.01" th:field="*{salary}" placeholder="e.g. 85000">
                <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Save Employee</button>
    </form>
</div>

<div class="card">
    <h2>Registered Employees (<span th:text="${#lists.size(employees)}">0</span>)</h2>

    <form th:action="@{/employees}" method="get" class="search-bar">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by employee name...">
        <button type="submit" class="btn btn-primary" style="margin-top:0;">Search</button>
        <a th:href="@{/employees}" class="btn btn-secondary">Reset</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="7" style="text-align:center; color:#6b7280;">No employees found.</td>
        </tr>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.fullName}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.phone}"></td>
            <td th:text="${emp.department}"></td>
            <td th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}"></td>
            <td>
                <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-edit">Edit</a>
                <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('Are you sure you want to delete this employee?');">
                    <button type="submit" class="btn btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
